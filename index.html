<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PeeceeGrandson | Royal Palace Resort | Jabalpur</title>

  <meta name="description" content="PeeceeGrandson Royal Palace Resort in Jabalpur. Opening Soon." />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

  <!-- External CSS -->
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>

  <main class="container">

    <img src="images/logo.png" alt="PeeceeGrandson Logo" class="logo" />

    <h1>PeeceeGrandson</h1>
    <div class="subtitle">Royal Palace Resort</div>
    <div class="location">Jabalpur • Madhya Pradesh</div>

    <section class="countdown">
      <div class="time-box">
        <span id="days">00</span>
        <small>Days</small>
      </div>
      <div class="time-box">
        <span id="hours">00</span>
        <small>Hours</small>
      </div>
      <div class="time-box">
        <span id="minutes">00</span>
        <small>Minutes</small>
      </div>
      <div class="time-box">
        <span id="seconds">00</span>
        <small>Seconds</small>
      </div>
    </section>

    <p class="description">
      A sanctuary of regal elegance and timeless grandeur.
      Where royal heritage meets modern luxury.
    </p>

    <a href="#" class="btn">Reserve Your Royal Stay</a>

    <footer>
      © 2026 PeeceeGrandson Royal Palace Resort
    </footer>

  </main>

  <!-- External JS -->
  <script src="js/countdown.js"></script>

</body>
</html>
